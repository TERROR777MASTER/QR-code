
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 35px 25px;
            width: 90%;
            max-width: 450px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 12px;
            font-size: 30px;
        }

        p {
            color: #ddd;
            margin-bottom: 30px;
        }

        .project-btn {
            display: block;
            text-decoration: none;
            color: white;
            background: #007bff;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 17px;
            transition: 0.3s;
        }

        .project-btn:hover {
            background: #0056b3;
            transform: scale(1.04);
        }

        footer {
            margin-top: 25px;
            color: #bbb;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Projects</h1>

        <p>Welcome! Choose a project below.</p>

        <!-- First Project -->
        <a href="https://weather-forecasting-delta-lovat.vercel.app/"
           class="project-btn" target="_blank">
            Project 1
        </a>

        <!-- Second Project -->
        <a href="https://portfoliowebsite-ruddy-zeta.vercel.app/"
           class="project-btn" target="_blank">
            Project 2
        </a>

        <footer>
            © 2026 | My HTML Projects
        </footer>

    </div>

</body>
</html>
